<app-navbar></app-navbar>
<div class="main">
    <div class="header">
        <h1>Notifications</h1>
    </div>
    <div id="main">
        @for (notification of notifications; track $index) {
            <div class="message">
                <h3>{{notification.user}}</h3>
                <p>{{notification.message}}</p>
            </div>
        }
    </div>
</div>
