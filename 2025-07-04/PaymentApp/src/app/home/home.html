<div class="main">

    <form [formGroup]="formGroup" class="form" (ngSubmit)="onPay()">
        <h2>Payment App</h2>
        <mat-form-field>
            <mat-label>Name</mat-label>
            <input matInput formControlName="name">
            <mat-error>Name is required</mat-error>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Email</mat-label>
            <input matInput formControlName="email">
            <mat-error>Email is required</mat-error>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Contact No</mat-label>
            <input matInput formControlName="contact" type="number">
            <mat-error>Contact No. is invalid</mat-error>
        </mat-form-field>
        <mat-form-field floatLabel="always">
            <mat-label>Amount</mat-label>
            <input matInput type="number" class="example-right-align" placeholder="0" formControlName="amount" />
            <span matTextPrefix>₹&nbsp;</span>
            <span matTextSuffix>.00</span>
            <mat-error>Minimum Amount should be ₹ 1</mat-error>
        </mat-form-field>
        
        <button matButton="tonal" [disabled]="formGroup.invalid">Pay</button>
    </form>
</div>
