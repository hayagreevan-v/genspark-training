<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Network</title>
</head>
<body>
    <h1>

    </h1>
    <button onclick="get()">Click</button>
    <script>
        const get = async() =>{
            const res = await fetch('/api/');
            const data = await res.text();
            document.querySelector('h1').innerHTML = data;
        }
    </script>
</body>
</html>
