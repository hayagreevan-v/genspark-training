<div class="input">
    <label for="title">Title : </label>
    <input type="text" id="title" placeholder="Title" [(ngModel)]="title">
</div>
<div class="input">
    <label for="description">Description : </label>
    <input type="text" id="description" placeholder="Description" [(ngModel)]="description">
</div>
<div class="input">
    <label for="file">Video : </label>
    <input type="file" id="file" (change)="onFileChange($event)">
</div>
<button (click)="upload()">Upload</button>
