<h1>
    <link rel="preconnect" href="https://plus.unsplash.com">
    <!-- interpolation -->
    Hello {{name}}

    <!-- Property binding -->
    <input type="text" #uname [value]="name">
    <!-- <input type="text" #uname [value]="name" (change)="onButtonClick(uname.value)"> -->

    <!-- Two way binding -->
    <input type="text" #uname [(ngModel)]="name">

    <i [class]='balloonClass' (click)="toggleBalloon()"></i>
    <!-- Event Binding -->
    <button (click)="onButtonClick(uname.value)">Click</button>
    <hr>
    <img 
    ngSrc="https://plus.unsplash.com/premium_photo-1749747537947-5f118ee03528?q=80&w=1287&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    height="600"
    width="400"
    priority="low"
    >
</h1>
